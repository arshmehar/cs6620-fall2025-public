name: docker build push

on:
  push:
    branches: [ "week02" ]
  # pull_request:
  #   branches: [ "week02" ]
  # GitHub doesn’t give secrets to workflows triggered by pull requests from forks, so the login step fails on those runs.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code 
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}

        labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
 
